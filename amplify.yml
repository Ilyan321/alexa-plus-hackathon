version: 1
applications:
  - appRoot: frontend-dashboard
    frontend:
      phases:
        preBuild:
          commands:
            - env | grep -E '^APP_AWS_' > .env.production || true
            - npm ci
        build:
          commands:
            - npm run build
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
          - .next/cache/**/*
